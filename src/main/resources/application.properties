spring.application.name=todo_app

# URL de connexion MySQL (cree automatiquement la base si elle n'existe pas)
spring.datasource.url=jdbc:mysql://localhost:3306/todo_app_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Pilote et dialecte Hibernate pour MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gestion automatique des tables (update = cree et met a jour les tables sans effacer les donnees)
spring.jpa.hibernate.ddl-auto=update

# Afficher les requetes SQL dans la console (utile pour debugger)
spring.jpa.show-sql=true

# Configuration JWT
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

